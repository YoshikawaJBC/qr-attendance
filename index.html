<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QRコード受付</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
  <h1>QRコード受付</h1>
  <p>会員のQRコードをカメラにかざしてください。</p>

  <div id="reader" style="width:100%; max-width:400px;"></div>
  <h3 id="result">カメラを起動してください。</h3>

  <script>
let isProcessing = false;
    function onScanSuccess(decodedText) {
if (isProcessing) return;
isProcessing = true;
      const parts = decodedText.split("|");

  if (parts.length !== 2) {
    document.getElementById("result").textContent =
      "QRコードの形式が正しくありません。";
  isProcessing = false;
    return;
  }

  const memberNumber = parts[0];
  const authCode = parts[1];

  document.getElementById("result").textContent =
    "会員番号 " + memberNumber + " を読み取りました。";
      setTimeout(() => {
  isProcessing = false;
}, 2000);
}

    const scanner = new Html5QrcodeScanner(
      "reader",
      { fps: 10, qrbox: 250 }
    );

    scanner.render(onScanSuccess);
  </script>
  <iframe
  id="gasBridge"
  src="https://script.google.com/a/macros/yoshikawa.ed.jp/s/AKfycbwCfdxcoopYAnMQdrlqEVKgRjUozwNxT7gqEgu_4r8Kab3mZCXj0Xhs_2-aKM86_Qib/exec"
  style="display:block; width:100%; height:300px;"
></iframe>

<script>
  const gasBridge = document.getElementById("gasBridge");

  const GAS_ORIGIN = new URL(gasBridge.src).origin;

  window.addEventListener("message", function(event) {
    console.log("メッセージの送信元:", event.origin);
    if (event.origin !== GAS_ORIGIN) return;
    if (event.source !== gasBridge.contentWindow) return;
    if (!event.data || event.data.type !== "PONG") return;

    document.getElementById("result").textContent =
      "GASとの接続に成功しました！";
  });

  gasBridge.addEventListener("load", function() {
    gasBridge.contentWindow.postMessage(
      { type: "PING" },
      GAS_ORIGIN
    );
  });
</script>
</body>
</html>
